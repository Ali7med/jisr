# قاعدة بيانات للتطوير المحلي فقط — النشر له تركيبته الخاصة (P2.4)
services:
  postgres:
    image: postgres:17-alpine
    container_name: jisr-dev-db
    environment:
      POSTGRES_USER: jisr
      POSTGRES_PASSWORD: jisr_dev
      POSTGRES_DB: jisr
    ports:
      - '5432:5432'
    volumes:
      - jisr-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jisr']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jisr-dev-db:
