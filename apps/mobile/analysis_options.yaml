# قواعد التحليل — أشدّ من الافتراضي عمداً.
# القاعدة: `flutter analyze` نظيف شرطٌ لأي دمج.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # هذه أخطاء حقيقية في تطبيق يتكلّم مع شبكة، لا مجرّد ملاحظات.
    invalid_use_of_protected_member: error
    missing_required_param: error
    missing_return: error
    unused_import: error
    unused_local_variable: error
    dead_code: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # الصحّة
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unnecessary_statements

    # الأسلوب والاتساق
    - avoid_redundant_argument_values
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - use_string_buffers

